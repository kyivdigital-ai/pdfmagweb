<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Holographic Cards</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    body {
      font-family: "Afacad", Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 28px 28px 36px;
      background: transparent;
    }

    .cards {
      --gap: 16px;
      width: min(100%, 1380px);
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: var(--gap);
    }

    .card-shell {
      --delay: 0s;
      position: relative;
      flex: 0 0 calc((100% - (var(--gap) * 5)) / 6);
      max-width: 205px;
      aspect-ratio: 0.68 / 1;
      perspective: 1200px;
      transform-style: preserve-3d;
      animation: floatCard 6.5s ease-in-out infinite;
      animation-delay: var(--delay);
      will-change: transform;
    }

    /* Keep the product card physically stable on touch devices so a tap is never interpreted as a drag. */
    .product-shell {
      animation: none;
      transform: none;
      perspective: none;
      z-index: 10;
    }

    .card {
      --x: 50%;
      --y: 50%;
      --tilt-x: 0deg;
      --tilt-y: 0deg;

      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 0;
      cursor: default;
      touch-action: pan-y;
      user-select: none;
      text-decoration: none;
      transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-origin: center;
      transform-style: preserve-3d;
      transition: transform 140ms cubic-bezier(.2,.8,.2,1);
      will-change: transform, background-position;

      background: linear-gradient(
        125deg,
        #061bff 0%,
        #0b49ff 12%,
        #58b8ff 24%,
        #d9ecff 35%,
        #ff4b3e 47%,
        #ff1b12 60%,
        #b80d25 72%,
        #225dff 86%,
        #0719c9 100%
      );
      background-size: 260% 260%;
      animation: gradientMove 8s ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .rainbow {
      position: absolute;
      inset: -35%;
      background: conic-gradient(
        from 150deg at var(--x) var(--y),
        rgba(0,55,255,.28),
        rgba(55,145,255,.34),
        rgba(205,232,255,.22),
        rgba(255,55,42,.34),
        rgba(255,15,15,.36),
        rgba(150,0,35,.30),
        rgba(45,105,255,.34),
        rgba(5,35,215,.32),
        rgba(255,45,35,.28)
      );
      mix-blend-mode: color-dodge;
      filter: blur(20px);
      opacity: .95;
      animation: rainbowMove 8s ease-in-out infinite;
      animation-delay: var(--delay);
      pointer-events: none;
    }

    .foil-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        118deg,
        rgba(255,255,255,0) 0px,
        rgba(255,255,255,.13) 2px,
        rgba(255,255,255,0) 7px
      );
      mix-blend-mode: overlay;
      opacity: .78;
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: .13;
      mix-blend-mode: soft-light;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    .glare {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at var(--x) var(--y),
        rgba(255,255,255,.98) 0%,
        rgba(220,235,255,.34) 12%,
        rgba(255,220,220,.10) 27%,
        transparent 48%
      );
      mix-blend-mode: screen;
      opacity: .86;
      pointer-events: none;
    }

    .question {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      padding: 0;
      font-family: "Afacad", Arial, sans-serif;
      font-size: clamp(58px, 5.4vw, 115px);
      font-weight: 600;
      line-height: .78;
      color: #050505;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }

    .product-card {
      position: relative;
      z-index: 20;
      cursor: pointer;
      background: #000;
      animation: none;
      transform: none !important;
      transition: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    .product-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes floatCard {
      0%   { transform: translateY(3px) rotateZ(-.25deg); }
      50%  { transform: translateY(-6px) rotateZ(.25deg); }
      100% { transform: translateY(3px) rotateZ(-.25deg); }
    }

    @keyframes gradientMove {
      0%   { background-position: 10% 20%; }
      50%  { background-position: 90% 80%; }
      100% { background-position: 10% 20%; }
    }

    @keyframes rainbowMove {
      0%   { transform: translate(-4%, -3%) rotate(-5deg); }
      50%  { transform: translate(5%, 4%) rotate(7deg); }
      100% { transform: translate(-4%, -3%) rotate(-5deg); }
    }

    @media (max-width: 700px) {
      .page {
        padding: 14px 10px 28px;
      }

      .cards {
        --gap: 10px;
        width: 100%;
      }

      .card-shell {
        flex: 0 0 calc((100% - var(--gap)) / 2);
        max-width: none;
      }

      .question {
        font-size: clamp(64px, 22vw, 126px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card-shell,
      .card,
      .rainbow { animation: none; }
      .card { transition: none; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="cards" aria-label="Holographic cards">
      <div class="card-shell product-shell">
        <a
          class="card product-card"
          href="https://pdf-mag.com/traceyafrica/"
          target="_top"
          aria-label="TRACEY AFRICA"
        >
          <img src="traceyafrica1.jpg" alt="TRACEY AFRICA" draggable="false" />
        </a>
      </div>

      <div class="card-shell" style="--delay:-0.6s"><div class="card holo-card"><div class="rainbow"></div><div class="foil-lines"></div><div class="grain"></div><div class="glare"></div><div class="question">?</div></div></div>
      <div class="card-shell" style="--delay:-1.2s"><div class="card holo-card"><div class="rainbow"></div><div class="foil-lines"></div><div class="grain"></div><div class="glare"></div><div class="question">?</div></div></div>
      <div class="card-shell" style="--delay:-1.8s"><div class="card holo-card"><div class="rainbow"></div><div class="foil-lines"></div><div class="grain"></div><div class="glare"></div><div class="question">?</div></div></div>
      <div class="card-shell" style="--delay:-2.4s"><div class="card holo-card"><div class="rainbow"></div><div class="foil-lines"></div><div class="grain"></div><div class="glare"></div><div class="question">?</div></div></div>
      <div class="card-shell" style="--delay:-3.0s"><div class="card holo-card"><div class="rainbow"></div><div class="foil-lines"></div><div class="grain"></div><div class="glare"></div><div class="question">?</div></div></div>
      <div class="card-shell" style="--delay:-3.6s"><div class="card holo-card"><div class="rainbow"></div><div class="foil-lines"></div><div class="grain"></div><div class="glare"></div><div class="question">?</div></div></div>
      <div class="card-shell" style="--delay:-4.2s"><div class="card holo-card"><div class="rainbow"></div><div class="foil-lines"></div><div class="grain"></div><div class="glare"></div><div class="question">?</div></div></div>
      <div class="card-shell" style="--delay:-4.8s"><div class="card holo-card"><div class="rainbow"></div><div class="foil-lines"></div><div class="grain"></div><div class="glare"></div><div class="question">?</div></div></div>
      <div class="card-shell" style="--delay:-5.4s"><div class="card holo-card"><div class="rainbow"></div><div class="foil-lines"></div><div class="grain"></div><div class="glare"></div><div class="question">?</div></div></div>
      <div class="card-shell" style="--delay:-6.0s"><div class="card holo-card"><div class="rainbow"></div><div class="foil-lines"></div><div class="grain"></div><div class="glare"></div><div class="question">?</div></div></div>
    </section>
  </main>

  <script>
    /* Only holographic placeholder cards get pointer/tilt handlers.
       The Tracey Africa product card stays a plain native link so taps remain reliable on iOS/Android. */
    const holoCards = document.querySelectorAll('.holo-card');

    function updateCard(card, clientX, clientY) {
      const rect = card.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));

      card.style.setProperty('--x', `${x * 100}%`);
      card.style.setProperty('--y', `${y * 100}%`);
      card.style.setProperty('--tilt-x', `${(0.5 - y) * 6}deg`);
      card.style.setProperty('--tilt-y', `${(x - 0.5) * 8}deg`);
    }

    function resetCard(card) {
      card.style.setProperty('--x', '50%');
      card.style.setProperty('--y', '50%');
      card.style.setProperty('--tilt-x', '0deg');
      card.style.setProperty('--tilt-y', '0deg');
    }

    holoCards.forEach((card) => {
      card.addEventListener('pointermove', (event) => {
        updateCard(card, event.clientX, event.clientY);
      });

      card.addEventListener('pointerdown', (event) => {
        updateCard(card, event.clientX, event.clientY);
      });

      card.addEventListener('pointerleave', () => resetCard(card));
      card.addEventListener('pointercancel', () => resetCard(card));

      card.addEventListener('pointerup', (event) => {
        if (event.pointerType === 'touch') {
          setTimeout(() => resetCard(card), 250);
        }
      });
    });
  </script>
</body>
</html>
